# Configuration file for the BaseCNN model in bone age prediction.
# This config defines settings for data preprocessing, model architecture, and training parameters.
# - Data section: Image size, CLAHE application, augmentation, and batch size.
# - Model section: Convolutional channels, dense units, dropout, and gender usage.
# - Training section: Epochs, patience, learning rate, results CSV, and test evaluation.

data:
  image_size: 256
  clahe: false
  augment: true
  batch_size: 16

model:
  channels: [32, 64, 128]
  dense_units: 128
  dropout_rate: 0.2
  use_gender: true

training:
  epochs: 70
  patience: 10
  learning_rate: 0.001
  results_csv: "experiments/train_results_summary.csv"
  perform_test: true
