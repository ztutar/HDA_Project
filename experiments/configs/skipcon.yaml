data:
  image_size: 256
  clahe: false
  augment: false
  batch_size: 16

model:
  stem_filters: 32
  block_filters: [32, 64, 128]
  blocks_per_stage: [2, 2, 2]
  dense_units: 128
  dropout_rate: 0.2
  use_gender: false

training:
  epochs: 70
  patience: 10
  learning_rate: 0.001
  results_csv: "experiments/train_results_summary.csv"
  perform_test: true
