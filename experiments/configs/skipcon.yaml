# Configuration file for the SkipConCNN model in bone age prediction.
# This config defines settings for data preprocessing, model architecture, and training parameters.
# - Data section: Image size, CLAHE application, augmentation, and batch size.
# - Model section: Base filters, block filters per stage, blocks per stage, dense units, dropout, and gender usage.
# - Training section: Epochs, patience, learning rate, results CSV, and test evaluation.

data:
  image_size: 256
  clahe: true
  augment: false
  batch_size: 16

model:
  base_filters: 32
  block_filters: [32, 64, 128]
  blocks_per_stage: [2, 2, 2]
  dense_units: 128
  dropout_rate: 0.2
  use_gender: true

training:
  epochs: 70
  patience: 10
  learning_rate: 0.001
  results_csv: "experiments/train_results_summary.csv"
  perform_test: true
