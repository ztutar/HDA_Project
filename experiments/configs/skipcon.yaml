data:
  image_size: 256
  clahe: true
  augment: false
  batch_size: 16

model:
  skipcon_stem_filters: 32
  skipcon_block_filters: [32, 64, 128]
  skipcon_blocks_per_stage: [2, 2, 2]
  dense_units: 128
  dropout_rate: 0.2
  use_gender: true

training:
  epochs: 70
  patience: 10
  learning_rate: 0.001
  results_csv: "experiments/train_results_summary.csv"
  perform_test: true
