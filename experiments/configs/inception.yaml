data:
  image_size: 256
  clahe: false
  augment: true
  batch_size: 16

model:
  base_filters: 32
  num_a_blocks: 2
  num_b_blocks: 3
  num_c_blocks: 1
  dense_units: 128
  dropout_rate: 0.2
  use_gender: true

training:
  epochs: 70
  patience: 10
  learning_rate: 0.001
  results_csv: "experiments/train_results_summary.csv"
  perform_test: true
